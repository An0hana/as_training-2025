lidar_perception_node:
  ros__parameters:
    roi:
      x_min: 0.0
      x_max: 30.0
      y_min: -15.0
      y_max: 15.0
      z_min: -2.5
      z_max: -0.8

    distance:
      range_min: 0.0
      range_max: 30.0
      layer_count: 5

    voxel:
      near_x: 0.07
      near_y: 0.07
      near_z: 0.04
      far_x: 0.025
      far_y: 0.025
      far_z: 0.015

    patchwork:
      sensor_height: 1.6

    cluster:
      bev_grid_res: 0.3
      min_size: 3
      max_size: 50

    detection:
      max_sx: 0.3
      max_sy: 0.3
      min_sz: 0.04
      max_sz: 0.3
      max_aspect_ratio: 2.0
      max_elevation: -0.2

    timing:
      fallback_dt: 0.1
      max_dt: 0.5

    tracking:
      match_thresh: 1.0
      max_missed: 3
      kf_q_pos: 0.5
      kf_q_vel: 50.0
      kf_r_pos: 0.01
      kf_p_init_vel: 50.0

    marker:
      box_scale_min: 0.2
      lifetime: 0.2